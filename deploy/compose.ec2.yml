name: syncspace-ec2

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Required}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CORS_ORIGINS: ${PUBLIC_ORIGIN:?Required}
  TRUST_PROXY: 1
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:?Required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Required}', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru', '--save', '', '--appendonly', 'no']
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    image: ${API_IMAGE:?Required}
    command: ['node', 'dist/infrastructure/database/migrate-cli.js']
    environment: *api-env
    mem_limit: 256m
    logging: *logging

  api:
    image: ${API_IMAGE:?Required}
    restart: unless-stopped
    mem_limit: 256m
    environment: *api-env
    stop_grace_period: 15s
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health/ready > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    logging: *logging

  web:
    image: ${WEB_IMAGE:?Required}
    restart: unless-stopped
    mem_limit: 192m
    environment:
      API_PROXY_TARGET: http://api:4000
    ports:
      - '80:5173'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5173/ > /dev/null && wget -qO- http://127.0.0.1:5173/api/health/ready > /dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    logging: *logging

volumes:
  postgres-data:
